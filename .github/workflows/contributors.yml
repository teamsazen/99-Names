# Redraws the README's Contributors block (avatars with commit counts) after
# every push to main, and once a day in case nothing was pushed.
name: Contributors

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/contributors.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pushes made with GITHUB_TOKEN don't start workflows, so this can't loop.
      - name: Commit if changed
        run: |
          git add .github/readme/contributors-*.svg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contributors"
          git pull --rebase origin main
          git push
